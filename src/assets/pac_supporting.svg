    <g id="pac-ring-masses" stroke-width="6">
      <g id="pac-raised-upper-phenyl-hand" transform="translate(-3 -42)"><path id="pac-upper-sidechain-phenyl-hand" d="M41 67 L61 78 V101 L41 112 L21 101 V78Z" fill="#ffcf83"/></g>
