<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="pac-title pac-description">
  <title id="pac-title">Pac, the steady molecular supporter</title>
  <desc id="pac-description">Pac braces its broad orange six-eight-six taxane core below its passenger and raises both phenyl-ring hands on the connected side chain. Its lifted eyebrows and upward glance reassure Isp. The benzoate and acetate feet retain their canonical positions.</desc>
  <!-- Both canonical foot contours remain exact; the broad core braces below its partner. -->
  <g id="pac-molecular-scaffold" stroke="#142b42" stroke-linecap="round" stroke-linejoin="round">
