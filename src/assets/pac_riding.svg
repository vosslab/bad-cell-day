<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="pac-title pac-description">
  <title id="pac-title">Pac, a delighted molecular passenger</title>
  <desc id="pac-description">Orange Pac raises its two phenyl-ring hands on a bent left side chain, looks down toward its partner with lifted eyebrows and a pleased smile, and balances on the same benzoate and acetate feet. Its six-eight-six taxane core and oxetane hip remain intact.</desc>
  <!-- The two phenyl hands lift on the connected side chain; feet retain their exact source paths. -->
  <g id="pac-molecular-scaffold" stroke="#142b42" stroke-linecap="round" stroke-linejoin="round">
    <g id="pac-riding-bonds"><path d="M106 142 L88 137 L71 134 L60 113 L82 122 M60 113 L68 90 L37 60 M71 134 L84 116 M145 86 L135 69 L119 69 L111 54 M119 69 L108 83 M145 146 L151 180 L126 184 M209 142 L207 184 L218 201 H230 M218 201 L208 218 M173 86 V72 M211 94 V79 M109 117 L97 108" fill="none" stroke="#142b42" stroke-width="14"/>
      <path d="M106 142 L88 137 L71 134 L60 113 L82 122 M60 113 L68 90 L37 60 M71 134 L84 116 M145 86 L135 69 L119 69 L111 54 M119 69 L108 83 M145 146 L151 180 L126 184 M209 142 L207 184 L218 201 H230 M218 201 L208 218 M173 86 V72 M211 94 V79 M109 117 L97 108" fill="none" stroke="#ffad50" stroke-width="7"/></g>
    <g id="pac-ring-masses" stroke-width="6">
      <g id="pac-lifted-upper-hand" transform="translate(-4 -52)"><path id="pac-upper-sidechain-phenyl-hand" d="M41 67 L61 78 V101 L41 112 L21 101 V78Z" fill="#ffcf83"/></g>
      <g id="pac-lifted-lower-hand" transform="translate(60 -72)"><path id="pac-lower-sidechain-phenyl-hand" d="M22 148 L42 159 V182 L22 194 L5 182 V160Z" fill="#ffad50"/></g>
      <g id="pac-riding-taxane-core" transform="translate(0 -18)"><path id="pac-taxane-six-left" d="M109 135 L130 127 L148 141 L145 164 L125 174 L106 160Z" fill="#ffad50"/>
      <path id="pac-taxane-eight-center" d="M130 127 L145 104 H173 L192 124 V149 L174 166 L145 164 L148 141Z" fill="#ffad50"/>
      <path id="pac-taxane-six-right" d="M192 124 L210 112 L229 124 V148 L210 160 L192 149Z" fill="#f39340"/>
      <path id="pac-oxetane-hip" d="M210 160 L220 179 L236 169 L229 148Z" fill="#ffcf83"/></g>
      <path id="pac-benzoate-phenyl-foot" d="M126 184 L147 193 V212 L128 222 L108 213 L106 195Z" fill="#e47d32"/>
    </g>
    <g id="pac-terminal-groups" fill="#ffda91" stroke-width="4">
      <circle cx="84" cy="113" r="6"/>
      <circle cx="110" cy="51" r="6"/>
      <circle cx="173" cy="70" r="6"/>
      <circle cx="211" cy="77" r="6"/>
      <path d="M201 213 Q208 208 215 214 L221 220 Q220 223 213 223 H200 Q196 220 201 213Z"/>
    </g>
  </g>
  <g id="pac-ring-accents" fill="none" stroke="#ffe0a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path transform="translate(-4 -52)" d="M29 82 L41 75 L53 82 M53 97 L41 104 M29 96 V86"/>
    <path transform="translate(60 -72)" d="M13 164 L23 156 L34 163 M34 178 L22 185"/>
    <path d="M114 198 L126 192 L139 198 M139 207 L128 214"/>
  </g>
  <g id="pac-face" transform="translate(0 -18)" stroke="#142b42" stroke-linecap="round" stroke-linejoin="round">
    <path d="M143 132 Q139 109 156 108 Q174 107 176 129 Q177 147 160 149 Q145 149 143 132Z" fill="#fffdf1" stroke-width="5"/>
    <path d="M178 132 Q178 112 195 114 Q211 115 211 134 Q210 152 194 152 Q179 151 178 132Z" fill="#fffdf1" stroke-width="5"/>
    <ellipse cx="160" cy="129" rx="6" ry="9" fill="#142b42" stroke="none"/>
    <ellipse cx="196" cy="132" rx="6" ry="9" fill="#142b42" stroke="none"/>
    <path d="M145 107 Q157 98 170 107 M183 111 Q195 104 207 114" fill="none" stroke-width="5"/>
    <path d="M155 158 Q173 173 194 156 M190 154 L197 156 L196 163" fill="none" stroke-width="5"/>
