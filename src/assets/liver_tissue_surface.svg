<svg xmlns="http://www.w3.org/2000/svg" width="128" height="120" viewBox="0 0 128 120" aria-hidden="true" focusable="false">
  <title>Liver tissue: heavy folds and a sulky growth</title>
  <desc>Original decorative anatomical fiction. Fused swollen lobules, broad cell cords, dark venous folds and one knobbly growth. No medical scale. Thin atlas crop 0,0,128,20; deep crop 0,24,128,96. The game supplies the continuous landing rim.</desc>
  <defs>
    <clipPath id="liver-shelf-bounds"><rect width="128" height="20"/></clipPath>
    <clipPath id="liver-lobule-bounds"><rect width="128" height="96"/></clipPath>
    <linearGradient id="liver-flesh" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="90">
      <stop stop-color="#c48770"/><stop offset="0.48" stop-color="#b46b61"/><stop offset="1" stop-color="#8b484f"/>
    </linearGradient>
    <linearGradient id="liver-thin-flesh" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="18">
      <stop stop-color="#c48770"/><stop offset="0.48" stop-color="#b46b61"/><stop offset="1" stop-color="#8b484f"/>
    </linearGradient>
    <linearGradient id="liver-growth" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#c29464"/><stop offset="1" stop-color="#936047"/>
    </linearGradient>
  </defs>
  <g id="liver-compressed-cords" clip-path="url(#liver-shelf-bounds)">
    <!-- Wide, fused hanging folds. Matching horizontal tangents at x=0 and x=128. -->
    <path id="liver-shelf-mass" fill="#673a43" d="M0 0H128V10C118 10 122 19 107 19C92 19 93 9 85 9C77 9 80 19 62 19C42 19 47 8 39 8C31 8 33 17 17 17C5 17 9 10 0 10Z"/>
    <path id="liver-shelf-front" fill="url(#liver-thin-flesh)" d="M0 0H128V7C117 7 120 16 107 16C94 16 95 6 85 6C74 6 78 16 62 16C44 16 49 5 39 5C29 5 32 14 17 14C5 14 9 7 0 7Z"/>
    <g id="liver-shelf-swollen-shoulders" fill="#cd9277">
      <path d="M8 3C14 1 28 1 33 3C27 3 28 10 19 10C11 10 12 5 8 3Z"/>
      <path d="M48 3C57 1 70 1 78 3C72 4 74 11 63 11C52 11 53 5 48 3Z"/>
      <path d="M94 3C102 1 113 1 118 3C113 4 115 11 107 11C99 11 100 5 94 3Z"/>
    </g>
    <g id="liver-shelf-venous-folds" fill="none" stroke="#82434c" stroke-width="1.6" stroke-linecap="round">
      <path d="M18 4Q22 6 20 10M21 7L26 5M59 4Q57 8 63 12M60 8L67 6M105 4Q110 6 107 11"/>
    </g>
    <path id="liver-shelf-rounded-underside" fill="none" stroke="#492c36" stroke-width="1.5" d="M0 10C9 10 5 17 17 17C33 17 31 8 39 8C47 8 42 19 62 19C80 19 77 9 85 9C93 9 92 19 107 19C122 19 118 10 128 10"/>
  </g>
  <g id="liver-fused-lobules" transform="translate(0 24)" clip-path="url(#liver-lobule-bounds)">
    <!-- The dark bed is one continuous skin, including all upper landing pixels. -->
    <path id="liver-living-bed" fill="#673b45" d="M0 0H128V57C119 57 125 85 108 87C89 91 91 63 80 64C72 65 80 94 57 94C34 94 38 64 30 64C21 64 25 81 13 78C2 75 9 57 0 57Z"/>
    <g id="liver-swollen-lobule-masses" fill="url(#liver-flesh)">
      <path d="M0 0H46C45 10 38 16 37 28C35 43 42 54 33 61C22 65 25 77 14 74C4 72 10 53 0 53Z"/>
      <path d="M44 0H87C83 12 76 19 80 35C85 51 74 57 72 73C70 88 64 91 56 90C38 87 43 69 37 57C30 43 38 33 39 23C38 12 46 9 44 0Z"/>
      <path d="M86 0H128V53C117 53 122 81 109 83C92 86 97 63 85 58C73 51 81 42 79 29C74 17 86 13 86 0Z"/>
    </g>
    <!-- Broad lit shoulders explain volume before the smaller cords and veins. -->
    <g id="liver-lobule-shoulders" fill="#c78970">
      <path d="M4 7C14 2 29 4 34 10C29 17 30 24 23 27C11 30 2 21 4 7Z"/>
      <path d="M48 8C56 3 72 4 76 10C68 17 74 28 66 33C51 39 42 30 45 22C48 17 46 13 48 8Z"/>
      <path d="M91 8C101 3 118 5 123 11C124 22 115 27 105 28C93 28 88 20 91 8Z"/>
      <path d="M45 45C50 40 63 40 69 46C71 52 65 64 66 69C66 79 56 83 50 74C46 66 51 58 45 45Z"/>
    </g>
    <g id="liver-cell-cords" fill="none" stroke="#d09576" stroke-width="3.5" stroke-linecap="round">
      <path d="M9 12Q15 8 20 12M10 25Q15 30 22 28M49 16Q52 11 57 13M64 11Q71 13 69 19M52 25Q55 29 60 27M96 14Q102 9 107 13M111 18Q116 20 118 16M51 49Q57 46 61 49M54 63Q52 70 57 73"/>
    </g>
    <g id="liver-branching-sinusoids" fill="none" stroke="#82434c" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 10C19 17 28 20 23 27C19 34 12 33 13 42M24 23Q30 22 31 17M21 30L25 35M15 36L8 34"/>
      <path d="M62 10C57 17 65 19 60 25C56 30 51 30 52 37M60 23L68 25M56 29L50 24"/>
      <path d="M107 10C102 17 110 21 105 27C101 31 93 28 94 37M106 23L114 26M99 30L101 35"/>
      <path d="M58 45C54 52 62 55 58 61L59 73M58 57L51 58M59 64L64 62"/>
    </g>
    <g id="liver-venous-dimples" fill="#733b47">
      <ellipse cx="23" cy="26" rx="3" ry="2.5"/><ellipse cx="60" cy="24" rx="3" ry="2.5"/><ellipse cx="105" cy="25" rx="3" ry="2.5"/><ellipse cx="58" cy="60" rx="2.6" ry="3"/>
    </g>
    <!-- Knobbly ochre tissue grows into the crease, away from the landing surface. -->
    <g id="liver-contained-tumor-nodule" stroke="#744149" stroke-width="1.6" stroke-linejoin="round">
      <path fill="url(#liver-growth)" d="M88 39C85 33 94 29 98 34C105 30 111 36 109 41C116 44 113 52 108 54C109 62 101 66 96 61C89 64 82 59 85 53C78 49 81 42 88 39Z"/>
      <path fill="#c39164" stroke="none" d="M91 40C89 36 95 34 98 39C102 35 108 40 104 44C111 47 106 53 101 50C99 56 92 53 93 49C87 49 86 43 91 40Z"/>
      <path fill="none" stroke-linecap="round" d="M91 43Q94 40 97 44M101 43Q105 45 102 48M92 54Q96 57 100 54M106 57L108 54"/>
    </g>
    <g id="liver-bottom-fold-light" fill="none" stroke="#b57465" stroke-width="2.5" stroke-linecap="round">
      <path d="M11 57Q10 67 15 68M48 77Q52 85 60 83M104 69Q102 77 109 77"/>
    </g>
    <path id="liver-rounded-underside" fill="none" stroke="#492c36" stroke-width="2" d="M0 57C9 57 2 75 13 78C25 81 21 64 30 64C38 64 34 94 57 94C80 94 72 65 80 64C91 63 89 91 108 87C125 85 119 57 128 57"/>
  </g>
</svg>
