<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="gem-title gem-description">
  <title id="gem-title">Gem, the bearded molecular trap</title>
  <desc id="gem-description">A purple gemcitabine molecule with a furious face on its upper six-member ring and an enormous jagged violet beard. A bond links that ring to the lower five-member sugar, whose paired fluorine branches form two pale fists. The hydroxyl branches plant its feet.</desc>
  <!-- Molecular silhouette follows the supplied gemcitabine structure. Atom labels,
       stereochemistry and bond multiplicities are simplified for a game sprite. -->
  <g id="gem-molecular-scaffold" stroke="#142b42" stroke-linecap="round" stroke-linejoin="round">
    <!-- The weapon-side branch is articulated by render_weapon.ts. -->
    <g id="gem-bond-limbs" fill="none">
      <path d="M145 24 V12 M183 89 L209 103 M145 112 V142 L131 155 M79 155 V127 H48 M90 190 V213 L71 219 M131 190 L152 205" stroke-width="15"/>
      <path d="M145 24 V12 M183 89 L209 103 M145 112 V142 L131 155 M79 155 V127 H48 M90 190 V213 L71 219 M131 190 L152 205" stroke="#ad7ef1" stroke-width="8"/>
    </g>
    <g id="gem-ring-masses" stroke-width="6">
      <path id="gem-cytosine-ring" d="M145 24 L183 46 V89 L145 112 L107 89 V46Z" fill="#ad7ef1"/>
      <path id="gem-sugar-ring" d="M79 155 L106 142 L145 155 L131 190 H90Z" fill="#9865dd"/>
    </g>
    <g id="gem-terminal-groups" stroke-width="5">
      <path d="M133 15 L139 6 L147 12 L156 7 L159 18 L148 25Z" fill="#d5b9ff"/>
      <circle cx="211" cy="104" r="10" fill="#d5b9ff"/>
      <path d="M39 119 Q30 124 36 135 Q42 142 51 136 Q58 128 50 121Z" fill="#d5b9ff"/>
      <path d="M60 211 Q72 207 80 216 L81 222 H56 Q51 217 60 211Z" fill="#d5b9ff"/>
      <path d="M148 196 Q158 194 164 205 Q165 215 156 218 Q147 220 143 212 Q138 205 148 196Z" fill="#b8e7ce"/>
    </g>
  </g>
  <g id="gem-ring-accents" fill="none" stroke="#ddc6ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M117 51 L145 35 L172 51 M88 160 L106 152 L129 160 M97 181 H122"/>
  </g>
  <g id="gem-outrageous-beard" stroke="#142b42" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M108 84 L97 98 L107 102 L92 118 L111 116 L100 139 L122 130 L124 157 L142 143 L156 171 L164 148 L186 160 L182 136 L207 141 L196 119 L217 114 L197 102 L200 88 L182 92 Q146 111 108 84Z" fill="#603294"/>
    <path d="M110 100 L122 115 L119 127 M134 114 L141 140 M158 118 L166 139 M181 108 L190 124" fill="none" stroke="#b58be5" stroke-width="5"/>
  </g>
  <g id="gem-furious-face" stroke="#142b42" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 58 Q124 53 138 69 L136 88 Q115 94 112 75Z" fill="#fffdf1" stroke-width="5"/>
    <path d="M151 69 Q164 49 180 56 L178 76 Q174 91 153 86Z" fill="#fffdf1" stroke-width="5"/>
    <ellipse cx="128" cy="74" rx="5" ry="9" fill="#142b42" stroke="none"/>
    <ellipse cx="163" cy="72" rx="5" ry="10" fill="#142b42" stroke="none"/>
    <path d="M109 52 L138 65 M151 64 L183 46" fill="none" stroke-width="8"/>
    <path d="M125 99 Q146 88 169 98 L165 115 Q145 125 127 112Z" fill="#142b42" stroke-width="4"/>
    <path d="M129 100 L165 100 L162 108 L131 108Z" fill="#fffdf1" stroke="none"/>
    <path d="M146 101 V108" fill="none" stroke-width="3"/>
  </g>
</svg>
