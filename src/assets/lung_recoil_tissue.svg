<svg xmlns="http://www.w3.org/2000/svg" width="300" height="160" viewBox="0 0 300 160" role="img" aria-labelledby="recoil-title recoil-description">
  <title id="recoil-title">The lung that is holding it in</title>
  <desc id="recoil-description">An original cartoon lung cushion with swollen air chambers, crooked capillaries, mucus and a lumpy tumor. The upper 300 by 80 frame rests with puffed cheeks; the lower frame squeezes its chambers and grimaces under a joint load. Both frames have the same straight cream contact membrane and fixed rectangular body. Fictional anatomy for a game, without medical scale.</desc>
