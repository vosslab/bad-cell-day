<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" aria-hidden="true" focusable="false">
  <title>Tumor: unruly swollen tissue</title>
  <desc>Original stylized tumor cross-section. Unequal cells, oversized irregular nuclei, pinched budding cells, cysts, and tortuous feeding vessels crowd the outside. The transparent middle is reserved for the actual final core and playable targets. Decorative fiction, not a diagnostic illustration.</desc>
