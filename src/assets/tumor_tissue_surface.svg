<svg xmlns="http://www.w3.org/2000/svg" width="128" height="120" viewBox="0 0 128 120" aria-hidden="true" focusable="false">
  <title>Tumor tissue: swollen cells and tangled plumbing</title>
  <desc>Original decorative anatomical fiction, without medical scale. Crowded irregular cells contain oversized lobed nuclei; amber blisters and knotted vessels interrupt the pink tissue. Thin crop 0,0,128,20; deep crop 0,24,128,96. Four-pixel transparent gutter, opaque material bands, horizontally repeating edges. The game supplies the straight landing rim.</desc>
  <defs>
    <clipPath id="tumor-thin-clip"><rect width="128" height="20"/></clipPath>
    <clipPath id="tumor-deep-clip"><rect width="128" height="96"/></clipPath>
    <g id="tumor-swollen-cell" stroke-linejoin="round">
      <path d="M-18-8C-22-20-9-26 1-22C10-28 24-18 22-7C30 2 22 19 12 19C4 28-13 22-15 14C-26 12-27-2-18-8Z" fill="#b45c80" stroke="#612941" stroke-width="2.6"/>
      <path d="M-18 5C-13 14-8 16 1 16C14 19 18 10 23 5C24 13 17 20 12 19C4 28-13 22-15 14C-20 14-23 10-23 5Z" fill="#914364"/>
      <path d="M-12-10C-15-18-4-21 1-17M6-17C12-19 17-14 17-10" fill="none" stroke="#d5879b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-7-8C-1-13 6-9 5-4C15-5 14 6 8 8C5 15-6 13-7 7C-15 7-14-4-7-8Z" fill="#762b54" stroke="#52243f" stroke-width="1.8"/>
      <path d="M-6-6Q-2-10 1-6" fill="none" stroke="#a4557b" stroke-width="1.4" stroke-linecap="round"/>
      <ellipse cx="5" cy="4" rx="2.8" ry="3.6" fill="#592440" transform="rotate(24 5 4)"/>
    </g>
    <g id="tumor-blister">
      <path d="M-8 1C-10-5-5-11 1-9C8-10 12-2 8 4C7 10-2 11-6 6C-9 6-10 3-8 1Z" fill="#c88979" stroke="#6c344b" stroke-width="2"/>
      <path d="M-5-3Q-2-8 3-5" fill="none" stroke="#edb69a" stroke-width="2" stroke-linecap="round"/>
      <path d="M-3 2Q1 5 5 1" fill="none" stroke="#9b535d" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="1" cy="1" r="1.5" fill="#9b535d"/>
    </g>
    <g id="tumor-thin-nodule">
      <path d="M-14 0C-13-7-5-9 0-6C7-10 15-6 15 0C18 6 9 10 2 8C-7 12-16 8-14 0Z" fill="#b96585" stroke="#6b2c48" stroke-width="1.5"/>
      <path d="M-5-2C-1-5 3-3 3-1C10-2 10 4 5 4C2 8-5 5-5 3C-9 3-9-1-5-2Z" fill="#752a51"/>
      <path d="M-10-2Q-7-6-3-4" fill="none" stroke="#db92a1" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>
  <g id="tumor-thin-material" clip-path="url(#tumor-thin-clip)">
    <rect width="128" height="20" fill="#93415f"/>
    <g id="tumor-thin-crowding">
      <use href="#tumor-thin-nodule" transform="translate(0 9)"/>
      <use href="#tumor-thin-nodule" transform="translate(32 10) rotate(-8)"/>
      <use href="#tumor-thin-nodule" transform="translate(64 8) rotate(8)"/>
      <use href="#tumor-thin-nodule" transform="translate(96 10) rotate(-5)"/>
      <use href="#tumor-thin-nodule" transform="translate(128 9)"/>
    </g>
    <path d="M0 16C10 16 12 12 17 13C23 14 21 19 28 18C39 15 46 17 51 16C57 15 55 11 60 12C66 13 64 17 71 17C81 17 85 13 90 15C96 20 101 14 108 16C116 18 119 16 128 16" fill="none" stroke="#682942" stroke-width="2.6"/>
    <path d="M13 11Q16 6 20 11Q20 16 15 14" fill="#ce927c" stroke="#793e50" stroke-width="1.2"/>
    <path d="M0 1H128" stroke="#cb8194" stroke-width="2"/>
    <path d="M0 19H128" stroke="#6c304b" stroke-width="2"/>
  </g>
  <g id="tumor-deep-material" transform="translate(0 24)" clip-path="url(#tumor-deep-clip)">
    <rect width="128" height="96" fill="#883b5c"/>
    <g id="tumor-packed-cell-masses">
      <use href="#tumor-swollen-cell" transform="translate(0 24) scale(.95 .95)"/>
      <use href="#tumor-swollen-cell" transform="translate(42 24) rotate(-14) scale(1.04 .96)"/>
      <use href="#tumor-swollen-cell" transform="translate(87 24) rotate(16) scale(.96 1.07)"/>
      <use href="#tumor-swollen-cell" transform="translate(128 24) scale(.95 .95)"/>
      <use href="#tumor-swollen-cell" transform="translate(20 70) rotate(17) scale(1.12 1.05)"/>
      <use href="#tumor-swollen-cell" transform="translate(67 73) rotate(-16) scale(1.08 1.04)"/>
      <use href="#tumor-swollen-cell" transform="translate(111 71) rotate(19) scale(.99 1.13)"/>
    </g>
    <g id="tumor-tangled-blood-supply" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-4 49C10 49 13 40 22 44C33 49 30 58 40 59C55 62 58 43 70 45C78 46 77 54 86 55C101 57 108 45 117 47C122 49 125 49 132 49M40 59C37 71 46 76 40 88M70 45C67 36 73 33 71 27M102 51C98 43 109 41 106 34C103 27 93 29 95 35C96 41 105 38 106 34" stroke="#602640" stroke-width="7"/>
      <path d="M-4 49C10 49 13 40 22 44C33 49 30 58 40 59C55 62 58 43 70 45C78 46 77 54 86 55C101 57 108 45 117 47C122 49 125 49 132 49M40 59C37 71 46 76 40 88M70 45C67 36 73 33 71 27M102 51C98 43 109 41 106 34C103 27 93 29 95 35C96 41 105 38 106 34" stroke="#b4697b" stroke-width="3.5"/>
      <path d="M12 46Q17 41 22 45M34 56Q38 60 43 58M59 50Q65 44 69 46M113 47Q117 46 121 49" stroke="#d28a97" stroke-width="1.2"/>
    </g>
    <g id="tumor-amber-blisters">
      <use href="#tumor-blister" transform="translate(20 34) scale(.74)"/>
      <use href="#tumor-blister" transform="translate(87 66) scale(.88)"/>
      <use href="#tumor-blister" transform="translate(95 79) scale(.46)"/>
    </g>
    <g id="tumor-uneasy-pore" transform="translate(49 79)">
      <path d="M-7-1C-8-7 0-10 5-6C11-2 6 7 0 7C-5 8-9 3-7-1Z" fill="#86425d" stroke="#622c46" stroke-width="1.5"/>
      <path d="M-3-1Q0-4 3-1M-2 3Q0 1 2 3" fill="none" stroke="#b87b8b" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <path id="tumor-surface-skin" d="M0 2C13 2 18 5 28 4C42 1 46 3 57 4C71 5 76 1 89 3C104 5 115 2 128 2" fill="none" stroke="#d58b9b" stroke-width="3"/>
    <path id="tumor-bottom-shadow" d="M0 95H128" stroke="#632d49" stroke-width="2"/>
  </g>
</svg>
