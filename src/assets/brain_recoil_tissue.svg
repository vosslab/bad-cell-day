<svg xmlns="http://www.w3.org/2000/svg" width="300" height="160" viewBox="0 0 300 160" role="img" aria-labelledby="brain-recoil-title brain-recoil-description">
  <title id="brain-recoil-title">A brain with a lot on its mind</title>
  <desc id="brain-recoil-description">Original fictional brain tissue for a comic cooperative game. The upper 300 by 80 frame has plump tangled folds and a distracted face. The lower frame clenches its eyes and squeezes its folds under two heroes. Both frames share the same full rectangular body and warm cream landing membrane. A quiet middle band accommodates the game's caption. Stylized anatomy without medical scale.</desc>
