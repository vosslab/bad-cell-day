<svg xmlns="http://www.w3.org/2000/svg" width="128" height="120" viewBox="0 0 128 120" aria-hidden="true" focusable="false">
  <title>Acid tissue: ruptured mucosa and bilious goo</title>
  <desc>Original decorative biological fiction. Fully opaque acid occupies the thin crop at 0,0,128,20 and deep crop at 0,24,128,96. Both repeat horizontally. Dissolving folds, swollen nodules, and sticky leaks stay inside the danger footprint; its continuous boundary belongs to the game renderer.</desc>
