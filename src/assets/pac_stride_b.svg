<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="pac-stride-b-title pac-stride-b-description">
  <title id="pac-stride-b-title">Pac, steady stride B</title>
  <desc id="pac-stride-b-description">Orange Pac keeps its broad six-eight-six taxane core, oxetane hip, and calm face steady. Its acetate foot plants forward while the benzoate-ring foot lifts behind. Its two phenyl-ring hands swing on the connected left side chain.</desc>
  <!-- Canonical taxane core, oxetane hip, and face stay fixed.
       The planted outline meets y=224; side-chain hands counter the short waddle. -->
  <g id="pac-stride-b-molecular-scaffold" stroke="#142b42" stroke-linecap="round" stroke-linejoin="round">
    <g id="pac-stride-b-bond-limbs" fill="none">
      <path d="M106 160 L103 177 L90 185 L77 164 M90 185 L81 155 L50 121 V94 M103 177 L108 153 M145 104 L135 87 L119 87 L111 72 M119 87 L108 101 M145 164 L131 170 L112 164 M209 160 L207 184 L206 200 H218 M206 200 L196 217 M173 104 V90 M211 112 V97 M109 135 L97 126" stroke-width="14"/>
