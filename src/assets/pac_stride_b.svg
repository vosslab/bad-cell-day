    </g>
    <g id="pac-stride-b-ring-masses" stroke-width="6">
      <path transform="translate(9 -17)" id="pac-stride-b-upper-sidechain-phenyl-hand" d="M41 67 L61 78 V101 L41 112 L21 101 V78Z" fill="#ffcf83"/>
      <path transform="translate(36 5)" id="pac-stride-b-lower-sidechain-phenyl-hand" d="M22 148 L42 159 V182 L22 194 L5 182 V160Z" fill="#ffad50"/>
      <path id="pac-stride-b-taxane-six-left" d="M109 135 L130 127 L148 141 L145 164 L125 174 L106 160Z" fill="#ffad50"/>
      <path id="pac-stride-b-taxane-eight-center" d="M130 127 L145 104 H173 L192 124 V149 L174 166 L145 164 L148 141Z" fill="#ffad50"/>
      <path id="pac-stride-b-taxane-six-right" d="M192 124 L210 112 L229 124 V148 L210 160 L192 149Z" fill="#f39340"/>
      <path id="pac-stride-b-oxetane-hip" d="M210 160 L220 179 L236 169 L229 148Z" fill="#ffcf83"/>
      <path transform="translate(-14 -20)" id="pac-stride-b-benzoate-phenyl-foot" d="M126 184 L147 193 V212 L128 222 L108 213 L106 195Z" fill="#e47d32"/>
    </g>
    <g id="pac-stride-b-terminal-groups" fill="#ffda91" stroke-width="4">
