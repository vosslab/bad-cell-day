<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="isp-title isp-description">
  <title id="isp-title">Isp, the delighted molecular passenger</title>
  <desc id="isp-description">A tall blue molecule character. Its fused middle rings carry eager eyes, its upper phenyl ring rises on a bent stalk, its chlorine and forked methyl branches lift as balancing arms, and its lower phenyl and amine branches plant two feet.</desc>
  <!-- The ring polygons and bond paths establish the character itself. Atom labels,
       stereochemistry, and most bond multiplicities are simplified for a game sprite. -->
  <g id="isp-molecular-scaffold" stroke="#142b42" stroke-linecap="round" stroke-linejoin="round">
    <g id="isp-bond-limbs" fill="none">
      <path d="M137 62 V82 L121 92 M111 91 V76 M57 125 L37 112 L28 91 M131 125 L151 107 L173 91 L187 76 M173 91 V73 M150 137 V157 L131 169 L119 178 M150 157 L169 169 V189 L187 200 V216" stroke-width="15"/>
      <path d="M137 62 V82 L121 92 M111 91 V76 M57 125 L37 112 L28 91 M131 125 L151 107 L173 91 L187 76 M173 91 V73 M150 137 V157 L131 169 L119 178 M150 157 L169 169 V189 L187 200 V216" stroke="#4dcaff" stroke-width="8"/>
    </g>
    <g id="isp-ring-masses" stroke-width="6">
      <path id="isp-upper-phenyl" d="M137 14 L158 26 V50 L137 63 L116 50 V26Z" fill="#4dcaff"/>
      <path id="isp-fused-benzene" d="M56 102 L75 91 L94 102 V125 L75 137 L56 125Z" fill="#4dcaff"/>
      <path id="isp-fused-heterocycle" d="M94 102 L112 91 L132 102 V125 L112 137 L94 125Z" fill="#36b8ed"/>
      <path id="isp-lower-phenyl-foot" d="M119 178 L139 189 V211 L119 221 L99 211 V189Z" fill="#2384bd"/>
    </g>
    <g id="isp-terminal-groups" stroke-width="5">
      <circle cx="111" cy="73" r="7" fill="#a1edff"/>
      <path d="M28 84 Q19 82 19 91 Q16 100 26 103 Q35 106 38 97 Q40 89 33 87" fill="#8bcf76"/>
      <circle cx="173" cy="70" r="8" fill="#a1edff"/>
      <circle cx="189" cy="74" r="8" fill="#a1edff"/>
      <path d="M180 210 Q187 205 194 211 L202 217 Q203 223 196 223 H180 Q173 219 180 210Z" fill="#a1edff"/>
    </g>
  </g>
  <g id="isp-ring-accents" fill="none" stroke="#a1edff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M124 30 L137 22 L150 30 M150 45 L137 54 M124 44 V34 M106 194 L119 186 L132 194 M132 206 L119 214"/>
  </g>
  <g id="isp-face" stroke="#142b42" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="80" cy="106" rx="16" ry="22" transform="rotate(-10 80 106)" fill="#fffdf1" stroke-width="5"/>
    <ellipse cx="113" cy="104" rx="15" ry="20" transform="rotate(10 113 104)" fill="#fffdf1" stroke-width="5"/>
    <ellipse cx="86" cy="112" rx="6" ry="10" fill="#142b42" stroke="none"/>
    <ellipse cx="118" cy="110" rx="6" ry="9" fill="#142b42" stroke="none"/>
    <circle cx="88" cy="108" r="2.5" fill="#fffdf1" stroke="none"/>
    <circle cx="120" cy="106" r="2.5" fill="#fffdf1" stroke="none"/>
    <path d="M86 135 Q100 146 117 131 Q113 151 99 150 Q91 148 86 135Z" fill="#142b42" stroke-width="3"/>
    <path d="M93 138 L107 136 L102 143 L96 143Z" fill="#fffdf1" stroke="none"/>
  </g>
</svg>
