  <title>A very twisted intestine</title>
  <desc>A broad folded intestinal tube coils around the play opening. A cutaway exposes fingerlike villi and sticky mucus; swollen cysts and tangled blood vessels distort the muscular wall. Fictional scenery, rather than a medical diagram.</desc>
