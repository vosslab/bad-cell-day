<svg xmlns="http://www.w3.org/2000/svg" width="128" height="120" viewBox="0 0 128 120" aria-hidden="true" focusable="false">
  <title>Marrow tissue: bone bridges with unwelcome tenants</title>
  <desc>Original decorative anatomical fiction without a medical scale. A continuous ivory cortex joins rounded porous bone struts around dark red marrow chambers, developing blood cells, and one crowded cyst. Thin crop: 0,0,128,20. Deep crop: 0,24,128,96. The gutter is transparent; both material bands are opaque. The game supplies the landing rim.</desc>
