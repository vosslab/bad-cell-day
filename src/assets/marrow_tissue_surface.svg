      <ellipse cy="0.4" rx="2.2" ry="1.3" fill="#853c57"/>
      <path d="M-3-1Q-1-2.7 1-2" fill="none" stroke="#df9b9a" stroke-width="1" stroke-linecap="round"/>
    </g>
