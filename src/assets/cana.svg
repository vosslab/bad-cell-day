<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="cana-title cana-description">
  <title id="cana-title">Cana, the smooth molecular energy thief</title>
  <desc id="cana-description">A sleek green canagliflozin molecule with four linked ring masses descending diagonally: fluorophenyl, thiophene, a smug clean-shaven methylphenyl face, and glucose. Its smooth chin and crooked smile show its confidence; the sugar hydroxyl branches become grabbing hands and planted feet.</desc>
  <!-- Ring connectivity follows the supplied canagliflozin drawing. Atom labels,
       stereochemistry and most bond multiplicities are simplified for a game sprite. -->
  <g id="cana-molecular-scaffold" stroke="#142b42" stroke-linecap="round" stroke-linejoin="round">
    <g id="cana-bond-limbs" fill="none">
      <path d="M29 34 L17 24 M58 72 L74 87 M105 105 H118 L129 126 M113 151 H91 M160 151 H176 M191 126 L182 108 M210 126 L221 108 M223 151 H231 M210 178 L216 199 H230 M184 177 L175 198 L157 216" stroke-width="14"/>
