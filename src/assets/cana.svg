      <path id="cana-thiophene-ring" d="M74 87 L94 80 L110 102 L95 123 L74 116Z" fill="#82cb60"/>
      <path id="cana-methylphenyl-face" d="M120 126 H151 L166 151 L151 178 H120 L105 151Z" fill="#82cb60"/>
