<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="isp-title isp-description">
  <title id="isp-title">Isp, a supportive molecular live wire</title>
  <desc id="isp-description">Blue Isp braces on the same two molecular feet, bends its tall phenyl crest aside, lifts its forked branch as a supporting hand, and looks up with an eager smile. Fused face rings and all branch connections remain visible.</desc>
  <!-- Feet and sole anchor preserve the canonical source geometry. -->
  <g id="isp-molecular-scaffold" stroke="#142b42" stroke-linecap="round" stroke-linejoin="round">
    <g id="isp-supporting-bonds"><path d="M70 77 L72 96 L75 135 M97 135 V120 M42 169 L29 151 L28 129 M118 169 L153 149 L175 135 L194 119 M175 135 V116 M118 169 L142 179 L150 167 L131 169 L119 178 M150 167 L169 179 V189 L187 200 V216" fill="none" stroke="#142b42" stroke-width="15"/>
      <path d="M70 77 L72 96 L75 135 M97 135 V120 M42 169 L29 151 L28 129 M118 169 L153 149 L175 135 L194 119 M175 135 V116 M118 169 L142 179 L150 167 L131 169 L119 178 M150 167 L169 179 V189 L187 200 V216" fill="none" stroke="#4dcaff" stroke-width="8"/></g>
    <g id="isp-ring-masses" stroke-width="6">
      <g id="isp-bent-phenyl-crest" transform="translate(-67 16)"><path id="isp-upper-phenyl" d="M137 14 L158 26 V50 L137 63 L116 50 V26Z" fill="#4dcaff"/></g>
      <g id="isp-braced-fused-core" transform="translate(-14 44)"><path id="isp-fused-benzene" d="M56 102 L75 91 L94 102 V125 L75 137 L56 125Z" fill="#4dcaff"/>
      <path id="isp-fused-heterocycle" d="M94 102 L112 91 L132 102 V125 L112 137 L94 125Z" fill="#36b8ed"/></g>
      <path id="isp-lower-phenyl-foot" d="M119 178 L139 189 V211 L119 221 L99 211 V189Z" fill="#2384bd"/>
    </g>
    <g id="isp-supporting-terminal-groups" stroke-width="5">
      <circle cx="97" cy="117" r="7" fill="#a1edff"/>
      <path d="M28 122 Q19 120 19 129 Q16 138 26 141 Q35 144 38 135 Q40 127 33 125" fill="#8bcf76"/>
      <circle cx="175" cy="113" r="8" fill="#a1edff"/>
      <circle cx="196" cy="117" r="8" fill="#a1edff"/>
      <path d="M180 210 Q187 205 194 211 L202 217 Q203 223 196 223 H180 Q173 219 180 210Z" fill="#a1edff"/>
    </g>
  </g>
  <g id="isp-ring-accents" fill="none" stroke="#a1edff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path transform="translate(-67 16)" d="M124 30 L137 22 L150 30 M150 45 L137 54 M124 44 V34"/>
    <path d="M106 194 L119 186 L132 194 M132 206 L119 214"/>
  </g>
  <g id="isp-face" transform="translate(-14 44)" stroke="#142b42" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="80" cy="106" rx="16" ry="22" transform="rotate(-10 80 106)" fill="#fffdf1" stroke-width="5"/>
    <ellipse cx="113" cy="104" rx="15" ry="20" transform="rotate(10 113 104)" fill="#fffdf1" stroke-width="5"/>
    <ellipse cx="82" cy="102" rx="6" ry="10" fill="#142b42" stroke="none"/>
    <ellipse cx="114" cy="100" rx="6" ry="9" fill="#142b42" stroke="none"/>
    <circle cx="84" cy="98" r="2.5" fill="#fffdf1" stroke="none"/>
    <circle cx="116" cy="96" r="2.5" fill="#fffdf1" stroke="none"/>
    <path d="M86 135 Q100 146 117 131 Q113 151 99 150 Q91 148 86 135Z" fill="#142b42" stroke-width="3"/>
    <path d="M93 138 L107 136 L102 143 L96 143Z" fill="#fffdf1" stroke="none"/>
  </g>
</svg>
