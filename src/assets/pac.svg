<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="pac-title pac-description">
  <title id="pac-title">Pac, the broad molecular steady one</title>
  <desc id="pac-description">A wide orange paclitaxel character whose six-eight-six taxane rings form its broad face and body. A small oxetane makes the right hip. The long left side chain branches into two phenyl-ring hands, while the lower benzoate ring and right acetate branch form planted feet.</desc>
  <!-- Connected ring masses follow the supplied paclitaxel drawing. Branches are
       thickened into limbs; labels, stereochemistry, and small oxygen groups are simplified. -->
  <g id="pac-molecular-scaffold" stroke="#142b42" stroke-linecap="round" stroke-linejoin="round">
    <g id="pac-bond-limbs" fill="none">
      <path d="M106 160 L89 169 L73 159 L57 169 L41 159 M57 169 V141 L41 132 V111 M73 159 V145 M145 104 L135 87 L119 87 L111 72 M119 87 L108 101 M145 164 V183 L126 184 M209 160 L207 184 L218 201 H230 M218 201 L208 218 M173 104 V90 M211 112 V97 M109 135 L97 126" stroke-width="14"/>
