    <path d="M178 132 Q178 112 195 114 Q211 115 211 134 Q210 152 194 152 Q179 151 178 132Z" fill="#fffdf1" stroke-width="5"/>
    <ellipse cx="164" cy="132" rx="6" ry="9" fill="#142b42" stroke="none"/>
    <ellipse cx="200" cy="135" rx="6" ry="9" fill="#142b42" stroke="none"/>
    <path d="M145 123 L172 126 M181 126 L207 130" fill="none" stroke-width="5"/>
