<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img" aria-labelledby="glucose-title glucose-description">
  <title id="glucose-title">The sugar pump</title>
  <desc id="glucose-description">An imaginary lopsided tumor heart with coiled pink conduits, branching veins and amber hexagonal sugar lights. A small pursed valve makes the pump look permanently hungry. Decorative game scenery, not an anatomical diagram.</desc>
