<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="isp-stride-a-title isp-stride-a-description">
  <title id="isp-stride-a-title">Isp, eager stride A</title>
  <desc id="isp-stride-a-description">Blue Isp keeps its eager face and fused molecular core steady. Its phenyl-ring foot plants forward while its amine foot folds behind. Chlorine and forked methyl branches counter-swing with the step.</desc>
  <!-- Canonical core and face stay fixed. Bond branches carry the alternating gait.
       The planted outline meets y=224; the other molecular foot clears the ground. -->
  <g id="isp-stride-a-molecular-scaffold" stroke="#142b42" stroke-linecap="round" stroke-linejoin="round">
    <g id="isp-stride-a-bond-limbs" fill="none">
      <path d="M137 62 V82 L121 92 M111 91 V76 M57 125 L42 115 M131 125 L150 137 L177 140 L195 155 M177 140 L183 122 M150 137 V157 L164 168 L157 178 M150 157 L130 175 L109 180 L109 192" stroke-width="15"/>
      <path d="M137 62 V82 L121 92 M111 91 V76 M57 125 L42 115 M131 125 L150 137 L177 140 L195 155 M177 140 L183 122 M150 137 V157 L164 168 L157 178 M150 157 L130 175 L109 180 L109 192" stroke="#4dcaff" stroke-width="8"/>
    </g>
    <g id="isp-stride-a-ring-masses" stroke-width="6">
      <path id="isp-stride-a-upper-phenyl" d="M137 14 L158 26 V50 L137 63 L116 50 V26Z" fill="#4dcaff"/>
      <path id="isp-stride-a-fused-benzene" d="M56 102 L75 91 L94 102 V125 L75 137 L56 125Z" fill="#4dcaff"/>
      <path id="isp-stride-a-fused-heterocycle" d="M94 102 L112 91 L132 102 V125 L112 137 L94 125Z" fill="#36b8ed"/>
      <path transform="translate(38 0)" id="isp-stride-a-lower-phenyl-foot" d="M119 178 L139 189 V211 L119 221 L99 211 V189Z" fill="#2384bd"/>
    </g>
    <g id="isp-stride-a-terminal-groups" stroke-width="5">
      <circle cx="111" cy="73" r="7" fill="#a1edff"/>
      <path transform="translate(-1 -19)" d="M43 126 Q34 124 34 133 Q31 142 41 145 Q50 148 53 139 Q55 131 48 129" fill="#8bcf76"/>
      <circle cx="183" cy="119" r="8" fill="#a1edff"/>
      <circle cx="197" cy="157" r="8" fill="#a1edff"/>
      <path transform="translate(-78 -24)" d="M180 210 Q187 205 194 211 L202 217 Q203 223 196 223 H180 Q173 219 180 210Z" fill="#a1edff"/>
    </g>
  </g>
  <g id="isp-stride-a-ring-accents" fill="none" stroke="#a1edff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M124 30 L137 22 L150 30 M150 45 L137 54 M124 44 V34"/>
    <path transform="translate(38 0)" d="M106 194 L119 186 L132 194 M132 206 L119 214"/>
  </g>
  <g id="isp-stride-a-face" stroke="#142b42" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="80" cy="106" rx="16" ry="22" transform="rotate(-10 80 106)" fill="#fffdf1" stroke-width="5"/>
    <ellipse cx="113" cy="104" rx="15" ry="20" transform="rotate(10 113 104)" fill="#fffdf1" stroke-width="5"/>
    <ellipse cx="85" cy="108" rx="6" ry="10" fill="#142b42" stroke="none"/>
    <ellipse cx="117" cy="106" rx="6" ry="9" fill="#142b42" stroke="none"/>
    <circle cx="87" cy="104" r="2.5" fill="#fffdf1" stroke="none"/>
    <circle cx="119" cy="102" r="2.5" fill="#fffdf1" stroke="none"/>
    <path d="M86 135 Q100 146 117 131 Q113 151 99 150 Q91 148 86 135Z" fill="#142b42" stroke-width="3"/>
    <path d="M93 138 L107 136 L102 143 L96 143Z" fill="#fffdf1" stroke="none"/>
  </g>
</svg>
